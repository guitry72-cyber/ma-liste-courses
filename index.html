<!doctype html><html lang='fr'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f6f3ed'><title>Ma Liste</title><link rel='manifest' href='./manifest.webmanifest'><link rel='apple-touch-icon' href='./icon-192.png'><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#222;background:#f6f3ed}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:18px 16px 90px}h1{font-size:27px;margin:5px 0 14px}.bar{display:flex;gap:8px;margin-bottom:12px}select,input,button{font:inherit;border:1px solid #ccc;border-radius:12px;padding:12px;background:white}.mic{width:100%;border:0;background:#1f5c46;color:white;font-weight:700;font-size:18px;padding:16px;margin:8px 0}.mic.listening{background:#9b2d30}.add{display:flex;gap:8px;margin:8px 0 18px}.add input{flex:1}.add button{font-weight:700}.cat{margin:18px 0}.cat h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;margin:0 0 7px;color:#555}.item{display:flex;align-items:center;gap:10px;background:#fff;padding:12px;border-radius:12px;margin:6px 0;box-shadow:0 1px 3px #00000012}.item.done{opacity:.45}.item.done .name{text-decoration:line-through}.item input{width:22px;height:22px}.name{flex:1}.qty{font-weight:650;color:#555}.del{border:0;background:transparent;padding:4px 8px;color:#8a2c2c}.empty{text-align:center;color:#777;margin-top:40px}.foot{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;border-top:1px solid #ddd;padding:10px;display:flex;justify-content:center}.foot button{max-width:650px;width:100%}#status{font-size:13px;color:#666;min-height:20px;text-align:center}</style></head><body><main><h1>🛒 Ma liste de courses</h1><div class='bar'><select id='store'><option>Général</option><option>Action</option><option>Delhaize</option><option>Carrefour</option><option>Lidl</option><option>Aldi</option></select></div><button id='mic' class='mic'>🎤 Dicter ma liste</button><div id='status'></div><div class='add'><input id='manual' placeholder='Ajouter un article…'><button id='addBtn'>＋</button></div><div id='list'></div></main><div class='foot'><button id='clear'>Effacer les articles cochés</button></div><script>
const cats=['Fruits & légumes','Viandes & volailles','Poissons & conserves de poisson','Produits frais & laitages','Fromages','Œufs','Pain & boulangerie','Conserves & légumineuses','Féculents & céréales','Épicerie, sauces & condiments','Épices & aromates','Petit-déjeuner & sucré','Boissons','Surgelés','Maison & papier','Entretien & nettoyage','Hygiène & soins','Divers'];
const dict={
'Fruits & légumes':['pomme','pommes','banane','bananes','kiwi','kiwis','concombre','concombres','tomate','tomates','oignon','oignons','échalote','échalotes','ail','avocat','haricots verts','patate douce'],
'Viandes & volailles':['poulet','boeuf','bœuf','steak','lardons','porc','dinde'],
'Poissons & conserves de poisson':['thon','sardine','sardines','saumon','crevette','crevettes'],
'Produits frais & laitages':['skyr','fromage blanc','yaourt','yaourts','lait','lait d’amande','lait d\'amande','lait d’avoine','lait d\'avoine'],
'Fromages':['feta','mozzarella','chèvre','fromage'],
'Œufs':['oeuf','oeufs','œuf','œufs'],
'Pain & boulangerie':['pain','baguette','pains'],
'Conserves & légumineuses':['lentilles','pois chiches','haricots rouges','haricots noirs','olives','tomates séchées'],
'Féculents & céréales':['riz','boulgour','pomme de terre','pommes de terre','pâtes','pates'],
'Épicerie, sauces & condiments':['pesto','pesto rouge','huile','vinaigre','mayonnaise','andalouse','concentré de tomate'],
'Épices & aromates':['épices poulet','paprika','tandoori','safran','poivre','sel','basilic'],
'Petit-déjeuner & sucré':['café','café en grains','flocons d’avoine','flocons d\'avoine','chocolat'],
'Boissons':['eau','eau pétillante','coca zéro','coca zero'],
'Maison & papier':['papier toilette','sachets de congélation','sacs congélation'],
'Entretien & nettoyage':['javel','javel wc','produit pour le sol','lessive','billes machine à laver'],
'Hygiène & soins':['shampoing','savon','dentifrice','strips nez']};
let items=JSON.parse(localStorage.getItem('shoppingItems')||'[]');let learned=JSON.parse(localStorage.getItem('shoppingLearned')||'{}');
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
function category(name){let n=norm(name);if(learned[n])return learned[n];for(const [c,words] of Object.entries(dict))if(words.some(w=>n.includes(norm(w))))return c;return 'Divers'}
function parsePart(raw){let s=raw.trim().replace(/^(il me faut|je veux|ajoute|du |de la |des )/i,'').trim();let qty='';let m=s.match(/^(\d+(?:[.,]\d+)?\s*(?:kg|g|l|ml|bouteilles?|paquets?|boîtes?|boites?)?|\d+)\s+(?:de |d’|d')?(.*)$/i);if(m){qty=m[1];s=m[2]}return {name:s.charAt(0).toUpperCase()+s.slice(1),qty,cat:category(s),done:false,id:crypto.randomUUID()}}
function addText(text){text=text.replace(/\bet\b/gi,',');text.split(/[,;]+/).map(x=>x.trim()).filter(Boolean).forEach(p=>items.push(parsePart(p)));save()}
function save(){localStorage.setItem('shoppingItems',JSON.stringify(items));render()}
function render(){const root=document.getElementById('list');root.innerHTML='';if(!items.length){root.innerHTML="<div class='empty'>Ta liste est vide.</div>";return}cats.forEach(c=>{let group=items.filter(x=>x.cat===c).sort((a,b)=>a.done-b.done);if(!group.length)return;let sec=document.createElement('section');sec.className='cat';sec.innerHTML=`<h2>${c}</h2>`;group.forEach(it=>{let d=document.createElement('div');d.className='item'+(it.done?' done':'');d.innerHTML=`<input type='checkbox' ${it.done?'checked':''}><span class='name'>${it.name}</span><span class='qty'>${it.qty||''}</span><button class='del'>✕</button>`;d.querySelector('input').onchange=e=>{it.done=e.target.checked;save()};d.querySelector('.del').onclick=()=>{items=items.filter(x=>x.id!==it.id);save()};d.querySelector('.name').onclick=()=>{let nc=prompt('Catégorie :\n'+cats.map((x,i)=>`${i+1}. ${x}`).join('\n'),String(cats.indexOf(it.cat)+1));let idx=Number(nc)-1;if(idx>=0&&idx<cats.length){it.cat=cats[idx];learned[norm(it.name)]=it.cat;localStorage.setItem('shoppingLearned',JSON.stringify(learned));save()}};sec.appendChild(d)});root.appendChild(sec)})}
document.getElementById('addBtn').onclick=()=>{let v=document.getElementById('manual').value.trim();if(v){addText(v);document.getElementById('manual').value=''}};document.getElementById('manual').onkeydown=e=>{if(e.key==='Enter')document.getElementById('addBtn').click()};document.getElementById('clear').onclick=()=>{items=items.filter(x=>!x.done);save()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const mic=document.getElementById('mic'),status=document.getElementById('status');if(!SR){mic.disabled=true;status.textContent='Reconnaissance vocale non disponible dans ce navigateur.'}else{const r=new SR();r.lang='fr-BE';r.interimResults=false;r.continuous=false;r.onstart=()=>{mic.classList.add('listening');mic.textContent='🔴 J’écoute…';status.textContent='Dicte plusieurs articles, séparés par « et » ou par une petite pause.'};r.onend=()=>{mic.classList.remove('listening');mic.textContent='🎤 Dicter ma liste'};r.onerror=e=>status.textContent='Dictée impossible : '+e.error;r.onresult=e=>{let t=e.results[0][0].transcript;status.textContent='Entendu : '+t;addText(t)};mic.onclick=()=>r.start()}
render();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}</script></body></html>
